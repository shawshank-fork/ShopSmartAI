name: ShopSmart AI CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Lint with flake8
        run: |
          pip install flake8
          flake8 shopsmart/ utils/ app.py --max-line-length=120 --ignore=E501,W503

      - name: Check imports
        run: |
          python -c "from shopsmart.config import Config; print('Config OK')"
          python -c "from shopsmart.analytics import AnalyticsTracker; print('Analytics OK')"
          python -c "from shopsmart.sentiment import SentimentAnalyzer; print('Sentiment OK')"
          python -c "from utils.logger import get_logger; print('Logger OK')"

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t shopsmart-ai:${{ github.sha }} .

      - name: Verify Docker image
        run: docker images shopsmart-ai
